name: "Check PR"
on:
  pull_request:
    branches: [main*]

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}-build-pr
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'push'
    name: Build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -U verify

      # Package up PR context for downstream workflow_run.
      # The values are passed through the environment and serialised with jq so that
      # branch names and other caller-controlled data cannot break out of the shell.
      - name: Prepare PR context artifact
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          jq -n \
            --arg pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg head_repo "$HEAD_REPO" \
            --arg head_branch "$HEAD_BRANCH" \
            --arg base_ref "$BASE_REF" \
            --arg run_id "$RUN_ID" \
            '{pr_number: $pr_number, head_sha: $head_sha, head_repo: $head_repo, head_branch: $head_branch, base_ref: $base_ref, run_id: $run_id}' \
            > pr-context.json
          cat pr-context.json

      # Upload PR context
      - name: Upload PR context
        uses: actions/upload-artifact@v7
        with:
          name: pr-context
          path: pr-context.json
          retention-days: 1
          if-no-files-found: error

      # Upload compiled classes
      - name: Upload Compiled Classes
        uses: actions/upload-artifact@v7
        with:
          name: compiled-classes
          path: target/classes

      # Upload Jacoco XML report(s)
      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: target/site/jacoco/jacoco.xml
