name: Sonar
on:
  workflow_dispatch:
    inputs:
      pr_number:   { description: "PR number", required: true }
      head_sha:    { description: "Head commit SHA", required: true }
      head_repo:   { description: "Fork repo full_name", required: true }
      head_branch: { description: "Fork branch", required: true }
      base_ref:    { description: "Base branch", required: true }
      run_id:      { description: "Upstream run ID", required: true }

# What appears in the Actions list
run-name: >-
  Sonar • PR #${{ inputs.pr_number }}
  • ${{ inputs.head_repo }}@${{ inputs.head_branch }}
  • ${{ inputs.head_sha }}

permissions:
  contents: read
  checks: write
  pull-requests: read
  actions: read

jobs:
  sonar:
    name: Sonar • PR #${{ inputs.pr_number }}
    runs-on: ubuntu-latest

    steps:
      # Workflow inputs are supplied by whoever dispatches this run, so they are read
      # through the environment rather than interpolated into the shell.
      - name: Export context
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
          HEAD_REPO: ${{ inputs.head_repo }}
          PR_BRANCH: ${{ inputs.head_branch }}
          BASE_BRANCH: ${{ inputs.base_ref }}
          UPSTREAM_RUN_ID: ${{ inputs.run_id }}
        run: |
          {
            echo "PR_NUMBER=$PR_NUMBER"
            echo "HEAD_SHA=$HEAD_SHA"
            echo "HEAD_REPO=$HEAD_REPO"
            echo "PR_BRANCH=$PR_BRANCH"
            echo "BASE_BRANCH=$BASE_BRANCH"
            echo "UPSTREAM_RUN_ID=$UPSTREAM_RUN_ID"
          } >> "$GITHUB_ENV"

      - name: Generate token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SONAR_GH_APP_ID }}
          private-key: ${{ secrets.SONAR_GH_APP_PRIVATE_KEY }}

      - name: Create GitHub Check (in_progress)
        id: create_check
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const check = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: `SonarQube Analysis`,
              head_sha: process.env.HEAD_SHA,
              status: "in_progress"
            });
            core.setOutput("check_id", check.data.id);

      # Checkout fork PR branch + fetch base to compute diff
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.HEAD_REPO }}
          ref: ${{ env.PR_BRANCH }}
          fetch-depth: 0

      - name: Fetch base branch
        env:
          UPSTREAM_CLONE_URL: ${{ github.event.repository.clone_url }}
        run: |
          git remote add upstream "$UPSTREAM_CLONE_URL"
          git fetch upstream "$BASE_BRANCH"
          git checkout -B "$BASE_BRANCH" "upstream/$BASE_BRANCH"
          git checkout "$PR_BRANCH"
          git clean -ffdx && git reset --hard HEAD

      - name: Download Compiled Classes from upstream run
        uses: actions/download-artifact@v8
        with:
          name: compiled-classes
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}
          path: target/classes

      - name: Download Coverage Reports from upstream run
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}
          path: target/site/jacoco

      - name: SonarCloud Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.scm.revision="$HEAD_SHA" \
            -Dsonar.pullrequest.key="$PR_NUMBER" \
            -Dsonar.pullrequest.branch="$PR_BRANCH" \
            -Dsonar.pullrequest.base="$BASE_BRANCH"

      - name: Finalize GitHub Check
        if: always()
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const checkId = "${{ steps.create_check.outputs.check_id }}";
            const status = "${{ job.status }}";
            const conclusions = { success: "success", failure: "failure", cancelled: "cancelled" };
            const conclusion = conclusions[status] || "failure";
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: checkId,
              completed_at: new Date().toISOString(),
              status: "completed",
              conclusion,
              output: {
                title: "SonarQube Analysis Result",
                summary: `✅ SonarQube analysis concluded with status: **${conclusion}**`,
              }
            });
